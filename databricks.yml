# Databricks Asset Bundle: deploys the notebooks and src/ to the workspace and
# defines the medallion job. Usage:
#   databricks bundle validate
#   databricks bundle deploy        # dev target, resources prefixed with your name
#   databricks bundle run olist_medallion
bundle:
  name: olist_platform

sync:
  exclude:
    - tests/**
    - docs/**

resources:
  jobs:
    olist_medallion:
      name: olist_medallion
      description: Bronze -> Silver -> Gold batch rebuild of the Olist lakehouse.
      max_concurrent_runs: 1
      timeout_seconds: 3600
      # No cluster settings: tasks run on serverless compute (the only option on Free Edition).
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/02_bronze_ingestion.py

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/03_silver_transformation.py

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/04_gold_analytics.py

targets:
  dev:
    mode: development
    default: true
